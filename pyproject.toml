[project]
name = "mini-rl-framework"
version = "0.1.0"
description = "A reinforcement learning framework built from scratch."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium[classic-control]>=1.4.0",
    "numpy>=2.5.3",
    "torch==2.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
