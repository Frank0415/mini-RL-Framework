[task]
prompt_template = "{question}\nReturn only the final integer on a line beginning with ####."

[data]
train = "data/train.jsonl"
max_size = 100000
batch_size = 32
eval = "data/eval.jsonl"

[verifier]
path = "verifier.py"

[model]
path = "model"

[rollout]
engine = "mini-sglang"
samples_per_prompt = 4
samples_per_update = 32
max_new_tokens = 512

[training]
learning_rate = 0.00001
minibatch_size = 4
update_epochs = 1
eval_every = 1

[checkpoint]
checkpoint_count = 3
checkpoint_location = "checkpoint"